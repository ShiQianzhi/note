<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="720" height="420" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="360" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">TCP 三次握手</text>
  
  <!-- Client and Server boxes -->
  <rect x="60" y="70" width="120" height="50" rx="8" fill="#e8f4fd" stroke="#2196f3" stroke-width="2"/>
  <text x="120" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565c0">客户端 Client</text>
  
  <rect x="540" y="70" width="120" height="50" rx="8" fill="#fce8e6" stroke="#f44336" stroke-width="2"/>
  <text x="600" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#c62828">服务端 Server</text>
  
  <!-- Vertical lines -->
  <line x1="120" y1="120" x2="120" y2="380" stroke="#9e9e9e" stroke-width="2"/>
  <line x1="600" y1="120" x2="600" y2="380" stroke="#9e9e9e" stroke-width="2"/>
  
  <!-- First handshake: SYN -->
  <line x1="120" y1="160" x2="600" y2="160" stroke="#4caf50" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="250" y="142" width="220" height="36" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="360" y="165" text-anchor="middle" font-size="15" fill="#2e7d32" font-weight="bold">SYN (seq=x)</text>
  
  <!-- State labels -->
  <text x="120" y="155" text-anchor="middle" font-size="12" fill="#1565c0">SYN_SENT</text>
  
  <!-- Second handshake: SYN+ACK -->
  <line x1="600" y1="230" x2="120" y2="230" stroke="#ff9800" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <rect x="250" y="212" width="220" height="36" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="360" y="235" text-anchor="middle" font-size="15" fill="#e65100" font-weight="bold">SYN+ACK (seq=y, ack=x+1)</text>
  
  <text x="600" y="225" text-anchor="middle" font-size="12" fill="#c62828">SYN_RCVD</text>
  <text x="120" y="250" text-anchor="middle" font-size="12" fill="#1565c0">ESTABLISHED</text>
  
  <!-- Third handshake: ACK -->
  <line x1="120" y1="300" x2="600" y2="300" stroke="#4caf50" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="250" y="282" width="220" height="36" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="360" y="305" text-anchor="middle" font-size="15" fill="#2e7d32" font-weight="bold">ACK (ack=y+1)</text>
  
  <text x="600" y="320" text-anchor="middle" font-size="12" fill="#c62828">ESTABLISHED</text>
  
  <!-- Data transfer -->
  <line x1="120" y1="360" x2="600" y2="360" stroke="#9c27b0" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowPurple)"/>
  <text x="360" y="355" text-anchor="middle" font-size="13" fill="#6a1b9a" font-weight="bold">数据传输开始</text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4caf50"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff9800"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#9c27b0"/>
    </marker>
  </defs>
</svg>
