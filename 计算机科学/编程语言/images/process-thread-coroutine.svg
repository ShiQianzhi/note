<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>
  
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">进程 · 线程 · 协程 的关系</text>
  
  <!-- Process container -->
  <rect x="40" y="60" width="680" height="280" rx="12" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="60" y="88" font-size="16" font-weight="bold" fill="#424242">进程 Process（独立地址空间、资源分配单位）</text>
  
  <!-- Thread 1 -->
  <rect x="70" y="110" width="200" height="210" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="170" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">线程 Thread 1</text>
  <text x="170" y="158" text-anchor="middle" font-size="11" fill="#1565c0">（内核调度、MB级栈）</text>
  
  <!-- Coroutines in thread 1 -->
  <rect x="85" y="175" width="170" height="30" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="170" y="195" text-anchor="middle" font-size="12" fill="#f57f17">协程 G1</text>
  
  <rect x="85" y="215" width="170" height="30" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="170" y="235" text-anchor="middle" font-size="12" fill="#f57f17">协程 G2</text>
  
  <rect x="85" y="255" width="170" height="30" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="170" y="275" text-anchor="middle" font-size="12" fill="#f57f17">协程 G3</text>
  
  <text x="170" y="308" text-anchor="middle" font-size="11" fill="#616161">用户态调度</text>
  
  <!-- Thread 2 -->
  <rect x="290" y="110" width="200" height="210" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="390" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">线程 Thread 2</text>
  <text x="390" y="158" text-anchor="middle" font-size="11" fill="#1565c0">（内核调度、MB级栈）</text>
  
  <rect x="305" y="175" width="170" height="30" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="390" y="195" text-anchor="middle" font-size="12" fill="#f57f17">协程 G4</text>
  
  <rect x="305" y="215" width="170" height="30" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="390" y="235" text-anchor="middle" font-size="12" fill="#f57f17">协程 G5</text>
  
  <rect x="305" y="255" width="170" height="30" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="390" y="275" text-anchor="middle" font-size="12" fill="#f57f17">协程 G6</text>
  
  <text x="390" y="308" text-anchor="middle" font-size="11" fill="#616161">用户态调度</text>
  
  <!-- Thread 3 -->
  <rect x="510" y="110" width="200" height="210" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="610" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">线程 Thread 3</text>
  <text x="610" y="158" text-anchor="middle" font-size="11" fill="#1565c0">（内核调度、MB级栈）</text>
  
  <rect x="525" y="175" width="170" height="30" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="610" y="195" text-anchor="middle" font-size="12" fill="#f57f17">协程 G7</text>
  
  <rect x="525" y="215" width="170" height="30" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="610" y="235" text-anchor="middle" font-size="12" fill="#f57f17">协程 G8</text>
  
  <rect x="525" y="255" width="170" height="30" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="610" y="275" text-anchor="middle" font-size="12" fill="#f57f17">协程 G9</text>
  
  <text x="610" y="308" text-anchor="middle" font-size="11" fill="#616161">用户态调度</text>
  
  <!-- Shared resources label -->
  <text x="380" y="355" text-anchor="middle" font-size="12" fill="#616161">同一进程内的线程共享地址空间、文件描述符等资源；协程共享线程资源</text>
</svg>
