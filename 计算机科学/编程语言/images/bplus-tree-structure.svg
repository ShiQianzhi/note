<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="460" fill="#ffffff"/>
  
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">B+ 树结构示意图</text>
  
  <!-- Root node (non-leaf, only keys) -->
  <rect x="300" y="55" width="160" height="44" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="380" y="83" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">根节点 [10, 30]</text>
  
  <!-- Level 2 non-leaf nodes -->
  <rect x="100" y="155" width="140" height="40" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="170" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">[5]</text>
  
  <rect x="310" y="155" width="140" height="40" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="380" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">[20]</text>
  
  <rect x="520" y="155" width="140" height="40" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="590" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">[40]</text>
  
  <!-- Connections root -> level2 -->
  <line x1="340" y1="99" x2="170" y2="155" stroke="#1976d2" stroke-width="1.5"/>
  <line x1="380" y1="99" x2="380" y2="155" stroke="#1976d2" stroke-width="1.5"/>
  <line x1="420" y1="99" x2="590" y2="155" stroke="#1976d2" stroke-width="1.5"/>
  
  <!-- Leaf nodes (store data) -->
  <rect x="40" y="270" width="80" height="50" rx="4" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="80" y="292" text-anchor="middle" font-size="13" fill="#e65100">key=3</text>
  <text x="80" y="310" text-anchor="middle" font-size="11" fill="#795548">数据A</text>
  
  <rect x="130" y="270" width="80" height="50" rx="4" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="170" y="292" text-anchor="middle" font-size="13" fill="#e65100">key=7</text>
  <text x="170" y="310" text-anchor="middle" font-size="11" fill="#795548">数据B</text>
  
  <rect x="250" y="270" width="80" height="50" rx="4" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="290" y="292" text-anchor="middle" font-size="13" fill="#e65100">key=15</text>
  <text x="290" y="310" text-anchor="middle" font-size="11" fill="#795548">数据C</text>
  
  <rect x="340" y="270" width="80" height="50" rx="4" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="380" y="292" text-anchor="middle" font-size="13" fill="#e65100">key=25</text>
  <text x="380" y="310" text-anchor="middle" font-size="11" fill="#795548">数据D</text>
  
  <rect x="460" y="270" width="80" height="50" rx="4" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="500" y="292" text-anchor="middle" font-size="13" fill="#e65100">key=35</text>
  <text x="500" y="310" text-anchor="middle" font-size="11" fill="#795548">数据E</text>
  
  <rect x="550" y="270" width="80" height="50" rx="4" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="590" y="292" text-anchor="middle" font-size="13" fill="#e65100">key=45</text>
  <text x="590" y="310" text-anchor="middle" font-size="11" fill="#795548">数据F</text>
  
  <rect x="640" y="270" width="80" height="50" rx="4" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="680" y="292" text-anchor="middle" font-size="13" fill="#e65100">key=50</text>
  <text x="680" y="310" text-anchor="middle" font-size="11" fill="#795548">数据G</text>
  
  <!-- Connections level2 -> leaves -->
  <line x1="170" y1="195" x2="80" y2="270" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="170" y1="195" x2="170" y2="270" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="380" y1="195" x2="290" y2="270" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="380" y1="195" x2="380" y2="270" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="590" y1="195" x2="500" y2="270" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="590" y1="195" x2="590" y2="270" stroke="#388e3c" stroke-width="1.5"/>
  <line x1="590" y1="195" x2="680" y2="270" stroke="#388e3c" stroke-width="1.5"/>
  
  <!-- Leaf node linked list arrows -->
  <line x1="120" y1="295" x2="130" y2="295" stroke="#f57c00" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="210" y1="295" x2="250" y2="295" stroke="#f57c00" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="330" y1="295" x2="340" y2="295" stroke="#f57c00" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="420" y1="295" x2="460" y2="295" stroke="#f57c00" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="540" y1="295" x2="550" y2="295" stroke="#f57c00" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="630" y1="295" x2="640" y2="295" stroke="#f57c00" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- Legend -->
  <text x="380" y="380" text-anchor="middle" font-size="13" fill="#1a1a1a">蓝色：根节点 | 绿色：非叶子节点（只存键） | 橙色：叶子节点（存数据 + 双向链表）</text>
  <text x="380" y="410" text-anchor="middle" font-size="13" fill="#616161">范围查询只需在叶子节点链表上顺序遍历</text>
  <text x="380" y="435" text-anchor="middle" font-size="13" fill="#616161">非叶子节点只存键 → 树更矮 → 磁盘 IO 更少</text>
  
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#f57c00"/>
    </marker>
  </defs>
</svg>
