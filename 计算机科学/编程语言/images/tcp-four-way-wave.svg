<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="720" height="480" fill="#ffffff"/>
  
  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">TCP 四次挥手</text>
  
  <!-- Client and Server -->
  <rect x="60" y="60" width="120" height="44" rx="8" fill="#e8f4fd" stroke="#2196f3" stroke-width="2"/>
  <text x="120" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565c0">客户端 Client</text>
  
  <rect x="540" y="60" width="120" height="44" rx="8" fill="#fce8e6" stroke="#f44336" stroke-width="2"/>
  <text x="600" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#c62828">服务端 Server</text>
  
  <line x1="120" y1="104" x2="120" y2="440" stroke="#9e9e9e" stroke-width="2"/>
  <line x1="600" y1="104" x2="600" y2="440" stroke="#9e9e9e" stroke-width="2"/>
  
  <!-- 1st wave: FIN -->
  <line x1="120" y1="150" x2="600" y2="150" stroke="#4caf50" stroke-width="2.5" marker-end="url(#ag)"/>
  <rect x="240" y="132" width="240" height="36" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="360" y="155" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">第一次挥手：FIN (seq=u)</text>
  <text x="120" y="145" text-anchor="middle" font-size="11" fill="#1565c0">FIN_WAIT_1</text>
  
  <!-- 2nd wave: ACK -->
  <line x1="600" y1="220" x2="120" y2="220" stroke="#ff9800" stroke-width="2.5" marker-end="url(#ao)"/>
  <rect x="240" y="202" width="240" height="36" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="360" y="225" text-anchor="middle" font-size="14" fill="#e65100" font-weight="bold">第二次挥手：ACK (ack=u+1)</text>
  <text x="600" y="215" text-anchor="middle" font-size="11" fill="#c62828">CLOSE_WAIT</text>
  <text x="120" y="240" text-anchor="middle" font-size="11" fill="#1565c0">FIN_WAIT_2</text>
  
  <!-- Server may send remaining data -->
  <text x="360" y="265" text-anchor="middle" font-size="12" fill="#616161" font-style="italic">（服务端可能继续发送剩余数据）</text>
  
  <!-- 3rd wave: FIN -->
  <line x1="600" y1="300" x2="120" y2="300" stroke="#ff9800" stroke-width="2.5" marker-end="url(#ao)"/>
  <rect x="240" y="282" width="240" height="36" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="360" y="305" text-anchor="middle" font-size="14" fill="#e65100" font-weight="bold">第三次挥手：FIN (seq=w)</text>
  <text x="600" y="320" text-anchor="middle" font-size="11" fill="#c62828">LAST_ACK</text>
  
  <!-- 4th wave: ACK -->
  <line x1="120" y1="370" x2="600" y2="370" stroke="#4caf50" stroke-width="2.5" marker-end="url(#ag)"/>
  <rect x="240" y="352" width="240" height="36" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="360" y="375" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">第四次挥手：ACK (ack=w+1)</text>
  <text x="120" y="395" text-anchor="middle" font-size="11" fill="#1565c0">TIME_WAIT</text>
  <text x="120" y="412" text-anchor="middle" font-size="10" fill="#1565c0">(等待 2MSL)</text>
  <text x="600" y="395" text-anchor="middle" font-size="11" fill="#c62828">CLOSED</text>
  
  <text x="360" y="440" text-anchor="middle" font-size="12" fill="#616161">全双工连接需双向关闭，FIN 与 ACK 无法合并 → 四次挥手</text>
  
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4caf50"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff9800"/>
    </marker>
  </defs>
</svg>
