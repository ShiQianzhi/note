<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="720" height="560" fill="#ffffff"/>

  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">计算机科学知识体系总览</text>

  <!-- 应用层 -->
  <rect x="220" y="60" width="280" height="56" rx="10" fill="#fce4ec" stroke="#c2185b" stroke-width="2.5"/>
  <text x="360" y="88" text-anchor="middle" font-size="17" font-weight="bold" fill="#880e4f">应用层</text>
  <text x="360" y="107" text-anchor="middle" font-size="13" fill="#ad1457">人工智能 · 系统架构 · 云原生</text>

  <!-- 应用层 -> 工程层 连线 -->
  <line x1="360" y1="116" x2="360" y2="140" stroke="#9e9e9e" stroke-width="2"/>

  <!-- 工程层 -->
  <rect x="200" y="140" width="320" height="56" rx="10" fill="#fff3e0" stroke="#f57c00" stroke-width="2.5"/>
  <text x="360" y="168" text-anchor="middle" font-size="17" font-weight="bold" fill="#e65100">工程层</text>
  <text x="360" y="187" text-anchor="middle" font-size="13" fill="#ef6c00">软件工程 · 系统设计 · 安全</text>

  <!-- 工程层 -> 中层三分支 连线 -->
  <line x1="360" y1="196" x2="360" y2="220" stroke="#9e9e9e" stroke-width="2"/>
  <line x1="150" y1="220" x2="570" y2="220" stroke="#9e9e9e" stroke-width="2"/>
  <line x1="150" y1="220" x2="150" y2="240" stroke="#9e9e9e" stroke-width="2"/>
  <line x1="360" y1="220" x2="360" y2="240" stroke="#9e9e9e" stroke-width="2"/>
  <line x1="570" y1="220" x2="570" y2="240" stroke="#9e9e9e" stroke-width="2"/>

  <!-- 数据层 -->
  <rect x="60" y="240" width="180" height="110" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2.5"/>
  <text x="150" y="268" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">数据层</text>
  <text x="150" y="294" text-anchor="middle" font-size="13" fill="#2e7d32">数据库</text>
  <text x="150" y="316" text-anchor="middle" font-size="13" fill="#2e7d32">数据结构与算法</text>
  <text x="150" y="338" text-anchor="middle" font-size="13" fill="#2e7d32">大数据 / 数据仓库</text>

  <!-- 系统层 -->
  <rect x="270" y="240" width="180" height="110" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.5"/>
  <text x="360" y="268" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">系统层</text>
  <text x="360" y="294" text-anchor="middle" font-size="13" fill="#1565c0">操作系统</text>
  <text x="360" y="316" text-anchor="middle" font-size="13" fill="#1565c0">编程语言</text>
  <text x="360" y="338" text-anchor="middle" font-size="13" fill="#1565c0">并发编程 / 运行时</text>

  <!-- 网络层 -->
  <rect x="480" y="240" width="180" height="110" rx="10" fill="#e8f5e9" stroke="#388e3c" stroke-width="2.5"/>
  <text x="570" y="268" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">网络层</text>
  <text x="570" y="294" text-anchor="middle" font-size="13" fill="#2e7d32">计算机网络</text>
  <text x="570" y="316" text-anchor="middle" font-size="13" fill="#2e7d32">网络协议 / HTTP</text>
  <text x="570" y="338" text-anchor="middle" font-size="13" fill="#2e7d32">网络安全</text>

  <!-- 中层三分支 -> 基础层 连线 -->
  <line x1="150" y1="350" x2="150" y2="380" stroke="#9e9e9e" stroke-width="2"/>
  <line x1="360" y1="350" x2="360" y2="380" stroke="#9e9e9e" stroke-width="2"/>
  <line x1="570" y1="350" x2="570" y2="380" stroke="#9e9e9e" stroke-width="2"/>
  <line x1="150" y1="380" x2="570" y2="380" stroke="#9e9e9e" stroke-width="2"/>
  <line x1="360" y1="380" x2="360" y2="400" stroke="#9e9e9e" stroke-width="2"/>

  <!-- 基础层 -->
  <rect x="160" y="400" width="400" height="80" rx="10" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2.5"/>
  <text x="360" y="430" text-anchor="middle" font-size="17" font-weight="bold" fill="#283593">基础层</text>
  <text x="360" y="456" text-anchor="middle" font-size="13" fill="#3949ab">计算机组成原理 · 编译原理 · 离散数学</text>
  <text x="360" y="475" text-anchor="middle" font-size="13" fill="#3949ab">概率论与数理统计 · 数字逻辑</text>

  <!-- 底部说明 -->
  <text x="360" y="525" text-anchor="middle" font-size="13" fill="#616161">自底向上：基础层提供物理与数学根基 → 系统层管理资源 → 数据/网络层负责存储与传输</text>
  <text x="360" y="548" text-anchor="middle" font-size="13" fill="#616161">→ 工程层保障质量 → 应用层是各领域的具体落地</text>
</svg>
