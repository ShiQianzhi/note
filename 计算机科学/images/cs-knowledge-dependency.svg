<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="780" height="520" fill="#ffffff"/>
  
  <text x="390" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">计算机科学知识依赖关系</text>
  <text x="390" y="54" text-anchor="middle" font-size="12" fill="#616161">箭头表示：学习前者有助于理解后者</text>
  
  <!-- Layer labels -->
  <text x="30" y="100" font-size="11" fill="#9e9e9e" font-weight="bold" transform="rotate(-90 30 100)">应用层</text>
  <text x="30" y="200" font-size="11" fill="#9e9e9e" font-weight="bold" transform="rotate(-90 30 200)">工程层</text>
  <text x="30" y="310" font-size="11" fill="#9e9e9e" font-weight="bold" transform="rotate(-90 30 310)">数据层 / 网络层</text>
  <text x="30" y="420" font-size="11" fill="#9e9e9e" font-weight="bold" transform="rotate(-90 30 420)">系统层</text>
  <text x="30" y="490" font-size="11" fill="#9e9e9e" font-weight="bold" transform="rotate(-90 30 490)">基础层</text>
  
  <!-- 基础层 -->
  <rect x="280" y="460" width="220" height="44" rx="8" fill="#e8eaf6" stroke="#3f51b5" stroke-width="2"/>
  <text x="390" y="487" text-anchor="middle" font-size="14" font-weight="bold" fill="#283593">组成原理 + 编译原理 + 数学</text>
  
  <!-- 系统层 -->
  <rect x="130" y="380" width="160" height="44" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="210" y="407" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">操作系统</text>
  
  <rect x="490" y="380" width="160" height="44" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="570" y="407" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">编程语言</text>
  
  <!-- 数据层 / 网络层 -->
  <rect x="70" y="280" width="160" height="44" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="150" y="307" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">数据结构与算法</text>
  
  <rect x="310" y="280" width="160" height="44" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="390" y="307" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">数据库</text>
  
  <rect x="550" y="280" width="160" height="44" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="630" y="307" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">计算机网络</text>
  
  <!-- 工程层 -->
  <rect x="230" y="180" width="320" height="44" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="390" y="207" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">软件工程 + 系统设计 + 安全</text>
  
  <!-- 应用层 -->
  <rect x="160" y="80" width="140" height="44" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="230" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#880e4f">人工智能</text>
  
  <rect x="320" y="80" width="140" height="44" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="390" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#880e4f">云原生</text>
  
  <rect x="480" y="80" width="140" height="44" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="550" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#880e4f">分布式系统</text>
  
  <!-- Arrows from base layer -->
  <line x1="350" y1="460" x2="250" y2="424" stroke="#3f51b5" stroke-width="1.8" marker-end="url(#arr1)"/>
  <line x1="430" y1="460" x2="530" y2="424" stroke="#3f51b5" stroke-width="1.8" marker-end="url(#arr1)"/>
  
  <!-- OS -> Data structures, DB, Network -->
  <line x1="190" y1="380" x2="170" y2="324" stroke="#1976d2" stroke-width="1.8" marker-end="url(#arr2)"/>
  <line x1="230" y1="380" x2="370" y2="324" stroke="#1976d2" stroke-width="1.8" marker-end="url(#arr2)"/>
  <line x1="250" y1="380" x2="600" y2="324" stroke="#1976d2" stroke-width="1.8" marker-end="url(#arr2)"/>
  
  <!-- Programming -> Data structures, Network -->
  <line x1="530" y1="380" x2="190" y2="324" stroke="#1976d2" stroke-width="1.8" marker-end="url(#arr2)"/>
  <line x1="560" y1="380" x2="620" y2="324" stroke="#1976d2" stroke-width="1.8" marker-end="url(#arr2)"/>
  
  <!-- Data layer -> Engineering -->
  <line x1="150" y1="280" x2="300" y2="224" stroke="#388e3c" stroke-width="1.8" marker-end="url(#arr3)"/>
  <line x1="390" y1="280" x2="390" y2="224" stroke="#388e3c" stroke-width="1.8" marker-end="url(#arr3)"/>
  <line x1="630" y1="280" x2="480" y2="224" stroke="#388e3c" stroke-width="1.8" marker-end="url(#arr3)"/>
  
  <!-- Engineering -> Applications -->
  <line x1="340" y1="180" x2="250" y2="124" stroke="#f57c00" stroke-width="1.8" marker-end="url(#arr4)"/>
  <line x1="390" y1="180" x2="390" y2="124" stroke="#f57c00" stroke-width="1.8" marker-end="url(#arr4)"/>
  <line x1="440" y1="180" x2="530" y2="124" stroke="#f57c00" stroke-width="1.8" marker-end="url(#arr4)"/>
  
  <defs>
    <marker id="arr1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#3f51b5"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#1976d2"/>
    </marker>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#388e3c"/>
    </marker>
    <marker id="arr4" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#f57c00"/>
    </marker>
  </defs>
</svg>
