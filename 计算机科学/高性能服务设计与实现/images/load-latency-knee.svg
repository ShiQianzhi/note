<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">负载增加时的延迟拐点</title>
  <desc id="desc">随着请求负载增加，延迟先保持平稳，接近容量上限后快速升高，系统从稳定区进入拐点区和过载区。</desc>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#111827">负载增加时的延迟拐点</text>
  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="120" y="90" width="560" height="450" fill="#eef8f1"/>
    <rect x="680" y="90" width="180" height="450" fill="#fff5dc"/>
    <rect x="860" y="90" width="230" height="450" fill="#fff0f0"/>
    <line x1="120" y1="540" x2="1100" y2="540" stroke="#111827" stroke-width="3"/>
    <polygon points="1115,540 1092,529 1092,551" fill="#111827"/>
    <line x1="120" y1="540" x2="120" y2="80" stroke="#111827" stroke-width="3"/>
    <polygon points="120,65 109,88 131,88" fill="#111827"/>
    <text x="1110" y="580" text-anchor="end" font-size="21" fill="#111827">到达负载</text>
    <text x="55" y="110" transform="rotate(-90 55 110)" text-anchor="end" font-size="21" fill="#111827">请求延迟</text>
    <text x="400" y="125" text-anchor="middle" font-size="23" font-weight="700" fill="#166534">稳定区</text>
    <text x="770" y="125" text-anchor="middle" font-size="23" font-weight="700" fill="#92400e">拐点区</text>
    <text x="975" y="125" text-anchor="middle" font-size="23" font-weight="700" fill="#991b1b">过载区</text>
    <path d="M145 475 C310 470, 470 464, 610 450 C690 442, 740 420, 780 375 C825 325, 845 250, 875 185 C910 115, 985 92, 1070 82" fill="none" stroke="#135fa7" stroke-width="8"/>
    <circle cx="790" cy="365" r="10" fill="#ffffff" stroke="#b45309" stroke-width="5"/>
    <line x1="790" y1="365" x2="790" y2="540" stroke="#b45309" stroke-width="3" stroke-dasharray="9 8"/>
    <text x="790" y="602" text-anchor="middle" font-size="20" font-weight="700" fill="#92400e">容量拐点</text>
    <line x1="680" y1="90" x2="680" y2="540" stroke="#166534" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="650" y="515" text-anchor="end" font-size="18" fill="#166534">建议在此之前设置安全容量</text>
    <g font-size="17" fill="#374151">
      <text x="400" y="165" text-anchor="middle">吞吐随负载增长</text>
      <text x="400" y="190" text-anchor="middle">延迟与错误率相对稳定</text>
      <text x="770" y="165" text-anchor="middle">队列开始增长</text>
      <text x="770" y="190" text-anchor="middle">P99 提前恶化</text>
      <text x="975" y="165" text-anchor="middle">超时与重试放大负载</text>
      <text x="975" y="190" text-anchor="middle">有效吞吐可能下降</text>
    </g>
    <text x="600" y="635" text-anchor="middle" font-size="17" fill="#4b5563">示意图仅表达典型关系，容量边界必须通过目标工作负载实测</text>
  </g>
</svg>
