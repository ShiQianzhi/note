<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
  <rect width="1100" height="680" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">Agent 编排引擎：DAG + 状态机执行流程</text>

  <!-- Input -->
  <ellipse cx="550" cy="75" rx="120" ry="28" fill="#e8f4fd" stroke="#2980b9" stroke-width="2"/>
  <text x="550" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a5276">接收用户目标 / 消息</text>

  <line x1="550" y1="103" x2="550" y2="125" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- Planner -->
  <rect x="400" y="125" width="300" height="56" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="550" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a7d0a">Planner 规划器</text>
  <text x="550" y="170" text-anchor="middle" font-size="12" fill="#555">意图识别 → 任务分解 → 生成 DAG 节点</text>

  <line x1="550" y1="181" x2="550" y2="205" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- DAG nodes -->
  <rect x="120" y="205" width="220" height="60" rx="8" fill="#fff" stroke="#8e44ad" stroke-width="2"/>
  <text x="230" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#6c3483">Node A: 知识检索</text>
  <text x="230" y="250" text-anchor="middle" font-size="11" fill="#555">RAG / 向量库召回</text>

  <rect x="440" y="205" width="220" height="60" rx="8" fill="#fff" stroke="#8e44ad" stroke-width="2"/>
  <text x="550" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#6c3483">Node B: 工具调用</text>
  <text x="550" y="250" text-anchor="middle" font-size="11" fill="#555">API / DB / 代码执行</text>

  <rect x="760" y="205" width="220" height="60" rx="8" fill="#fff" stroke="#8e44ad" stroke-width="2"/>
  <text x="870" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#6c3483">Node C: LLM 推理</text>
  <text x="870" y="250" text-anchor="middle" font-size="11" fill="#555">模型生成 / 推理</text>

  <!-- edges A->B, B->C (sequential example), and A->C dashed parallel -->
  <defs>
    <marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
  </defs>
  <line x1="340" y1="235" x2="440" y2="235" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="660" y1="235" x2="760" y2="235" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="340" y1="255" x2="760" y2="255" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ag)"/>
  <text x="550" y="272" text-anchor="middle" font-size="11" fill="#27ae60">可并行分支（依赖满足即执行）</text>

  <line x1="550" y1="265" x2="550" y2="300" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- State machine -->
  <rect x="120" y="300" width="860" height="200" rx="10" fill="#fafafa" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="140" y="325" font-size="14" font-weight="bold" fill="#2c3e50">节点状态机（每个 DAG 节点独立管理）</text>

  <rect x="150" y="345" width="130" height="48" rx="6" fill="#ecf0f1" stroke="#7f8c8d"/>
  <text x="215" y="374" text-anchor="middle" font-size="13" fill="#2c3e50">Pending</text>

  <rect x="310" y="345" width="130" height="48" rx="6" fill="#e8f4fd" stroke="#2980b9"/>
  <text x="375" y="374" text-anchor="middle" font-size="13" fill="#1a5276">Running</text>

  <rect x="470" y="345" width="130" height="48" rx="6" fill="#eafaf1" stroke="#27ae60"/>
  <text x="535" y="374" text-anchor="middle" font-size="13" fill="#1e8449">Success</text>

  <rect x="630" y="345" width="130" height="48" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="695" y="374" text-anchor="middle" font-size="13" fill="#922b21">Failed</text>

  <rect x="790" y="345" width="130" height="48" rx="6" fill="#fef5e7" stroke="#e67e22"/>
  <text x="855" y="374" text-anchor="middle" font-size="13" fill="#9a7d0a">Retrying</text>

  <line x1="280" y1="369" x2="310" y2="369" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="440" y1="369" x2="470" y2="369" stroke="#27ae60" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="440" y1="393" x2="695" y2="393" stroke="#c0392b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="695" y1="393" x2="855" y2="393" stroke="#e67e22" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="855" y1="345" x2="695" y2="345" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a)"/>

  <!-- Checkpoint / retry info -->
  <rect x="150" y="420" width="770" height="62" rx="6" fill="#fff" stroke="#7f8c8d"/>
  <text x="165" y="442" font-size="12" font-weight="bold" fill="#2c3e50">可靠性保障：</text>
  <text x="165" y="462" font-size="12" fill="#555">• 每节点状态变化写入 Checkpoint（Redis + DB），崩溃后可从最近成功节点恢复</text>
  <text x="165" y="478" font-size="12" fill="#555">• 指数退避重试（1s/2s/4s/8s，最多 3 次），超限转死信队列人工介入</text>

  <line x1="550" y1="500" x2="550" y2="525" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- Aggregator -->
  <rect x="350" y="525" width="400" height="56" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="550" y="550" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a7d0a">Aggregator 结果聚合</text>
  <text x="550" y="570" text-anchor="middle" font-size="12" fill="#555">汇总所有分支结果 → 判断是否继续规划</text>

  <line x1="550" y1="581" x2="550" y2="610" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- Output -->
  <ellipse cx="550" cy="640" rx="120" ry="28" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="550" y="645" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e8449">流式输出最终结果</text>
</svg>
