<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">LLM Gateway：模型路由、熔断降级与成本控制</text>

  <!-- Agent workers -->
  <rect x="30" y="80" width="200" height="400" rx="10" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="130" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a7d0a">Agent Worker</text>
  <rect x="50" y="130" width="160" height="40" rx="6" fill="#fff" stroke="#f39c12"/>
  <text x="130" y="155" text-anchor="middle" font-size="12" fill="#1a1a2e">请求推理 (stream)</text>
  <rect x="50" y="185" width="160" height="40" rx="6" fill="#fff" stroke="#f39c12"/>
  <text x="130" y="210" text-anchor="middle" font-size="12" fill="#1a1a2e">携带 priority / 预算</text>
  <rect x="50" y="240" width="160" height="40" rx="6" fill="#fff" stroke="#f39c12"/>
  <text x="130" y="265" text-anchor="middle" font-size="12" fill="#1a1a2e">接收 token 流</text>
  <rect x="50" y="310" width="160" height="60" rx="6" fill="#fff" stroke="#e67e22"/>
  <text x="130" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a7d0a">Prompt 缓存层</text>
  <text x="130" y="353" text-anchor="middle" font-size="11" fill="#555">相同前缀命中则复用</text>
  <rect x="50" y="385" width="160" height="55" rx="6" fill="#fff" stroke="#27ae60"/>
  <text x="130" y="408" text-anchor="middle" font-size="12" fill="#1a1a2e">本地 KV 缓存</text>
  <text x="130" y="426" text-anchor="middle" font-size="11" fill="#555">减少重复 token 计算</text>

  <!-- Gateway -->
  <rect x="280" y="80" width="260" height="400" rx="10" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2"/>
  <text x="410" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#6c3483">LLM Gateway</text>

  <rect x="300" y="125" width="220" height="40" rx="6" fill="#fff" stroke="#8e44ad"/>
  <text x="410" y="150" text-anchor="middle" font-size="12" fill="#1a1a2e">路由策略（按模型/负载/成本）</text>

  <rect x="300" y="175" width="220" height="40" rx="6" fill="#fff" stroke="#8e44ad"/>
  <text x="410" y="200" text-anchor="middle" font-size="12" fill="#1a1a2e">令牌桶限流（按账号/模型）</text>

  <rect x="300" y="225" width="220" height="40" rx="6" fill="#fff" stroke="#8e44ad"/>
  <text x="410" y="250" text-anchor="middle" font-size="12" fill="#1a1a2e">熔断检测（错误率/超时）</text>

  <rect x="300" y="275" width="220" height="40" rx="6" fill="#fff" stroke="#8e44ad"/>
  <text x="410" y="300" text-anchor="middle" font-size="12" fill="#1a1a2e">降级：主模型失败切备模型</text>

  <rect x="300" y="325" width="220" height="40" rx="6" fill="#fff" stroke="#8e44ad"/>
  <text x="410" y="350" text-anchor="middle" font-size="12" fill="#1a1a2e">成本统计 / Token 预算</text>

  <rect x="300" y="380" width="220" height="80" rx="6" fill="#fff" stroke="#c0392b"/>
  <text x="410" y="403" text-anchor="middle" font-size="12" font-weight="bold" fill="#922b21">Guard 守卫</text>
  <text x="410" y="423" text-anchor="middle" font-size="11" fill="#555">敏感词过滤 / 越权检测</text>
  <text x="410" y="440" text-anchor="middle" font-size="11" fill="#555">内容安全合规校验</text>

  <defs>
    <marker id="lg" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  <line x1="230" y1="150" x2="300" y2="145" stroke="#555" stroke-width="1.5" marker-end="url(#lg)"/>
  <line x1="230" y1="200" x2="300" y2="195" stroke="#555" stroke-width="1.5" marker-end="url(#lg)"/>

  <!-- Model providers -->
  <rect x="600" y="80" width="470" height="400" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="835" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e8449">模型提供方（多供应商）</text>

  <rect x="620" y="130" width="200" height="70" rx="8" fill="#fff" stroke="#27ae60"/>
  <text x="720" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e8449">主模型（高质量）</text>
  <text x="720" y="175" text-anchor="middle" font-size="11" fill="#555">如 GPT-4 / Claude 3.5</text>
  <text x="720" y="192" text-anchor="middle" font-size="11" fill="#e67e22">成本高 / 延迟高</text>

  <rect x="850" y="130" width="200" height="70" rx="8" fill="#fff" stroke="#27ae60"/>
  <text x="950" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e8449">备模型（兜底）</text>
  <text x="950" y="175" text-anchor="middle" font-size="11" fill="#555">如 GPT-3.5 / 国产模型</text>
  <text x="950" y="192" text-anchor="middle" font-size="11" fill="#27ae60">成本低 / 延迟低</text>

  <rect x="620" y="220" width="200" height="70" rx="8" fill="#fff" stroke="#27ae60"/>
  <text x="720" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e8449">私有部署模型</text>
  <text x="720" y="265" text-anchor="middle" font-size="11" fill="#555">本地 GPU 推理集群</text>
  <text x="720" y="282" text-anchor="middle" font-size="11" fill="#27ae60">数据不出域 / 可控</text>

  <rect x="850" y="220" width="200" height="70" rx="8" fill="#fff" stroke="#27ae60"/>
  <text x="950" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e8449">Embedding 模型</text>
  <text x="950" y="265" text-anchor="middle" font-size="11" fill="#555">向量化用于 RAG</text>
  <text x="950" y="282" text-anchor="middle" font-size="11" fill="#555">批量异步处理</text>

  <rect x="620" y="310" width="430" height="60" rx="8" fill="#fff" stroke="#27ae60"/>
  <text x="835" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e8449">推理加速层</text>
  <text x="835" y="355" text-anchor="middle" font-size="11" fill="#555">vLLM / SGLang 连续批处理（Continuous Batching）+ PagedAttention</text>

  <rect x="620" y="390" width="430" height="70" rx="8" fill="#fff" stroke="#2980b9"/>
  <text x="835" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a5276">成本控制策略</text>
  <text x="835" y="435" text-anchor="middle" font-size="11" fill="#555">• 简单意图走低成本模型 &nbsp;• 复杂推理走高阶模型</text>
  <text x="835" y="452" text-anchor="middle" font-size="11" fill="#555">• 单用户 Token 日配额 &nbsp;• 缓存命中优先复用计算</text>

  <line x1="540" y1="165" x2="620" y2="165" stroke="#555" stroke-width="1.5" marker-end="url(#lg)"/>
  <line x1="540" y1="255" x2="620" y2="255" stroke="#555" stroke-width="1.5" marker-end="url(#lg)"/>
  <line x1="540" y1="340" x2="620" y2="340" stroke="#555" stroke-width="1.5" marker-end="url(#lg)"/>
  <line x1="540" y1="420" x2="620" y2="420" stroke="#555" stroke-width="1.5" marker-end="url(#lg)"/>
</svg>
