<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">DNS 域名层级与区域授权</title>
  <desc id="desc">展示根、顶级域、二级域和子域之间从上到下的委派关系</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .title{font:700 30px Arial,"PingFang SC",sans-serif;fill:#111827}
      .sub{font:16px Arial,"PingFang SC",sans-serif;fill:#374151}
      .node-title{font:700 22px Arial,"PingFang SC",sans-serif;fill:#111827}
      .node-sub{font:15px Arial,"PingFang SC",sans-serif;fill:#374151}
      .edge{stroke:#1f2937;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#6b7280;stroke-width:2;stroke-dasharray:8 7;fill:none}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">DNS 名称空间：从根向下逐级委派</text>
  <text x="600" y="78" text-anchor="middle" class="sub">域名从右向左定位层级，管理权通过 NS 记录向下转交</text>

  <rect x="475" y="110" width="250" height="82" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
  <text x="600" y="143" text-anchor="middle" class="node-title">根区域 .</text>
  <text x="600" y="171" text-anchor="middle" class="node-sub">Root Zone</text>

  <path d="M600 192 L280 270" class="edge"/>
  <path d="M600 192 L600 270" class="edge"/>
  <path d="M600 192 L920 270" class="edge"/>

  <rect x="155" y="270" width="250" height="82" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="280" y="303" text-anchor="middle" class="node-title">.org</text>
  <text x="280" y="331" text-anchor="middle" class="node-sub">顶级域 TLD</text>
  <rect x="475" y="270" width="250" height="82" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="600" y="303" text-anchor="middle" class="node-title">.com</text>
  <text x="600" y="331" text-anchor="middle" class="node-sub">顶级域 TLD</text>
  <rect x="795" y="270" width="250" height="82" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="920" y="303" text-anchor="middle" class="node-title">.cn</text>
  <text x="920" y="331" text-anchor="middle" class="node-sub">顶级域 TLD</text>

  <path d="M600 352 L600 430" class="edge"/>
  <rect x="435" y="430" width="330" height="90" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
  <text x="600" y="466" text-anchor="middle" class="node-title">example.com.</text>
  <text x="600" y="495" text-anchor="middle" class="node-sub">组织管理的权威区域</text>

  <path d="M600 520 L340 602" class="edge"/>
  <path d="M600 520 L860 602" class="edge"/>
  <rect x="175" y="602" width="330" height="84" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="340" y="636" text-anchor="middle" class="node-title">www.example.com.</text>
  <text x="340" y="665" text-anchor="middle" class="node-sub">区域内的资源名称</text>
  <rect x="695" y="602" width="330" height="84" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="3"/>
  <text x="860" y="636" text-anchor="middle" class="node-title">shop.example.com.</text>
  <text x="860" y="665" text-anchor="middle" class="node-sub">可再次委派为独立子区域</text>

  <path d="M780 420 L1040 420 L1040 575 L930 575" class="dash"/>
  <text x="935" y="402" text-anchor="middle" class="node-sub">NS 委派形成区域边界</text>
</svg>
