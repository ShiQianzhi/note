<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780">
  <defs>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b91c1c"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, "PingFang SC", sans-serif; fill: #111827; }
      .sub { font: 16px Arial, "PingFang SC", sans-serif; fill: #4b5563; }
      .actor { font: 700 20px Arial, "PingFang SC", sans-serif; fill: #ffffff; }
      .msg { font: 700 16px Arial, "PingFang SC", sans-serif; fill: #111827; }
      .detail { font: 14px Arial, "PingFang SC", sans-serif; fill: #4b5563; }
      .blue { stroke: #1d4ed8; stroke-width: 3; marker-end: url(#blueArrow); }
      .red { stroke: #b91c1c; stroke-width: 3; marker-end: url(#redArrow); }
      .life { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect width="1280" height="780" fill="#ffffff"/>
  <text x="640" y="48" text-anchor="middle" class="title">HTTPS 与 TLS 1.3 建连流程</text>
  <text x="640" y="76" text-anchor="middle" class="sub">首次连接的简化 1-RTT 握手；HTTP 数据在双方验证 Finished 后获得机密性与完整性保护</text>

  <rect x="110" y="105" width="220" height="58" rx="8" fill="#1d4ed8"/>
  <text x="220" y="142" text-anchor="middle" class="actor">客户端 / 浏览器</text>
  <rect x="950" y="105" width="220" height="58" rx="8" fill="#b91c1c"/>
  <text x="1060" y="142" text-anchor="middle" class="actor">HTTPS 服务器</text>
  <line x1="220" y1="163" x2="220" y2="725" class="life"/>
  <line x1="1060" y1="163" x2="1060" y2="725" class="life"/>

  <line x1="220" y1="220" x2="1060" y2="220" class="blue"/>
  <text x="640" y="207" text-anchor="middle" class="msg">ClientHello</text>
  <text x="640" y="244" text-anchor="middle" class="detail">支持的算法、客户端密钥份额、SNI、ALPN（h2 / http/1.1）</text>

  <line x1="1060" y1="305" x2="220" y2="305" class="red"/>
  <text x="640" y="292" text-anchor="middle" class="msg">ServerHello</text>
  <text x="640" y="329" text-anchor="middle" class="detail">选定算法与服务器密钥份额；双方计算握手密钥</text>

  <line x1="1060" y1="390" x2="220" y2="390" class="red"/>
  <text x="640" y="377" text-anchor="middle" class="msg">EncryptedExtensions + Certificate + CertificateVerify</text>
  <text x="640" y="414" text-anchor="middle" class="detail">加密的扩展参数、证书链、服务器对握手内容的签名</text>

  <line x1="1060" y1="475" x2="220" y2="475" class="red"/>
  <text x="640" y="462" text-anchor="middle" class="msg">Finished</text>
  <text x="640" y="499" text-anchor="middle" class="detail">服务器证明握手消息完整，并切换到应用流量密钥</text>

  <rect x="70" y="525" width="300" height="82" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="220" y="555" text-anchor="middle" class="msg">客户端验证</text>
  <text x="220" y="581" text-anchor="middle" class="detail">证书链、域名、有效期、签名</text>

  <line x1="220" y1="640" x2="1060" y2="640" class="blue"/>
  <text x="640" y="627" text-anchor="middle" class="msg">Finished</text>
  <text x="640" y="664" text-anchor="middle" class="detail">客户端证明握手完整，双方确认会话密钥</text>

  <rect x="375" y="695" width="530" height="55" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="640" y="728" text-anchor="middle" class="msg">加密传输 HTTP 请求与响应</text>
</svg>
