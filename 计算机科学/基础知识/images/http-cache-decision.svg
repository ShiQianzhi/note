<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, "PingFang SC", sans-serif; fill: #111827; }
      .sub { font: 16px Arial, "PingFang SC", sans-serif; fill: #4b5563; }
      .text { font: 700 17px Arial, "PingFang SC", sans-serif; fill: #111827; }
      .small { font: 15px Arial, "PingFang SC", sans-serif; fill: #374151; }
      .yes { font: 700 15px Arial, "PingFang SC", sans-serif; fill: #15803d; }
      .no { font: 700 15px Arial, "PingFang SC", sans-serif; fill: #b91c1c; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="800" fill="#ffffff"/>
  <text x="640" y="48" text-anchor="middle" class="title">HTTP 缓存决策流程</text>
  <text x="640" y="76" text-anchor="middle" class="sub">缓存先判断是否有匹配响应，再判断新鲜度；过期并不等于必须下载完整内容</text>

  <rect x="490" y="105" width="300" height="66" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="640" y="145" text-anchor="middle" class="text">收到 GET /app.js</text>
  <path d="M640 171 V220" class="line"/>

  <path d="M640 215 L790 285 L640 355 L490 285 Z" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="640" y="280" text-anchor="middle" class="text">存在匹配的缓存响应？</text>
  <text x="640" y="307" text-anchor="middle" class="small">URI + 方法 + Vary 指定字段</text>

  <path d="M490 285 H285 V410" class="line"/>
  <text x="385" y="270" text-anchor="middle" class="no">否</text>
  <rect x="120" y="410" width="330" height="92" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="285" y="446" text-anchor="middle" class="text">请求源站并接收完整响应</text>
  <text x="285" y="475" text-anchor="middle" class="small">满足存储条件时写入缓存</text>

  <path d="M640 355 V400" class="line"/>
  <text x="658" y="382" class="yes">是</text>
  <path d="M640 395 L790 465 L640 535 L490 465 Z" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="640" y="460" text-anchor="middle" class="text">响应仍然新鲜？</text>
  <text x="640" y="487" text-anchor="middle" class="small">current_age &lt; freshness_lifetime</text>

  <path d="M790 465 H1000" class="line"/>
  <text x="895" y="450" text-anchor="middle" class="yes">是</text>
  <rect x="1000" y="420" width="230" height="90" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="1115" y="457" text-anchor="middle" class="text">直接复用缓存</text>
  <text x="1115" y="484" text-anchor="middle" class="small">无需联系源站</text>

  <path d="M640 535 V580" class="line"/>
  <text x="658" y="560" class="no">否</text>
  <rect x="455" y="580" width="370" height="92" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="640" y="615" text-anchor="middle" class="text">携带 ETag 或修改时间验证</text>
  <text x="640" y="646" text-anchor="middle" class="small">If-None-Match / If-Modified-Since</text>

  <path d="M455 626 H340 V715" class="line"/>
  <text x="390" y="610" text-anchor="middle" class="yes">304 未修改</text>
  <rect x="165" y="705" width="350" height="70" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="340" y="748" text-anchor="middle" class="text">复用内容并更新缓存元数据</text>

  <path d="M825 626 H940 V715" class="line"/>
  <text x="885" y="610" text-anchor="middle" class="no">200 已修改</text>
  <rect x="765" y="705" width="350" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="940" y="748" text-anchor="middle" class="text">使用新内容并替换缓存响应</text>

  <path d="M285 502 V740 H165" class="line"/>
  <text x="80" y="790" class="small">no-store：不得有意存储；no-cache：存储后每次复用前必须验证</text>
</svg>
