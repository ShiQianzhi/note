<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840">
  <defs>
    <marker id="arC3" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#4f46e5"/>
    </marker>
    <filter id="shC3" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="840" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="29" font-weight="700" fill="#0f172a">Agent 四大组件：一个后端工程师一眼能懂的拆法</text>
  <text x="600" y="84" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15.5" fill="#475569">不要被"智能体"三个字吓到——它依然是由大脑（RPC）、手脚（API）、记忆（缓存与库）、调度（状态机）拼出来的系统</text>

  <!-- 顶部：LLM -->
  <rect x="440" y="126" width="320" height="128" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" filter="url(#shC3)"/>
  <text x="600" y="160" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#312e81">① LLM 大脑</text>
  <text x="600" y="188" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#4338ca">后端类比：一个高延迟、按调用量计费、</text>
  <text x="600" y="208" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#4338ca">偶尔返回脏数据的第三方 RPC 服务</text>
  <text x="600" y="234" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#6366f1">治理手段：超时 · 重试 · 熔断 · 备用模型 · 输出校验</text>

  <!-- 左：Tools -->
  <rect x="70" y="356" width="320" height="150" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shC3)"/>
  <text x="230" y="390" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#92400e">② Tools 工具（手脚）</text>
  <text x="230" y="418" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#b45309">后端类比：你开放给新同事调用的</text>
  <text x="230" y="438" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#b45309">一组内部 API / RPC 接口</text>
  <text x="230" y="464" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#d97706">契约：名称 + 描述 + JSON Schema 入参</text>
  <text x="230" y="486" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#d97706">纪律：参数校验 · 幂等 · 最小权限 · 写操作确认</text>

  <!-- 中：Agent Loop -->
  <rect x="450" y="346" width="300" height="170" rx="16" fill="#0f172a"/>
  <text x="600" y="392" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#ffffff">Agent 主循环</text>
  <text x="600" y="424" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#cbd5e1">后端类比：一个事件驱动的</text>
  <text x="600" y="446" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#cbd5e1">while 状态机 / 编排器</text>
  <text x="600" y="482" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#94a3b8">感知 → 决策 → 行动 → 观察</text>
  <text x="600" y="504" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#94a3b8">循环直到任务完成或触发护栏</text>

  <!-- 右：Memory -->
  <rect x="810" y="356" width="320" height="150" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shC3)"/>
  <text x="970" y="390" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#065f46">③ Memory 记忆</text>
  <text x="970" y="418" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#047857">后端类比：Redis（会话热状态）</text>
  <text x="970" y="438" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#047857">+ 数据库 / 向量库（长期事实）</text>
  <text x="970" y="464" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#059669">短期：消息窗口与摘要 · 长期：按需检索</text>
  <text x="970" y="486" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#059669">注意：LLM 本身无状态，状态全在你手里</text>

  <!-- 底：Planner -->
  <rect x="440" y="604" width="320" height="128" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shC3)"/>
  <text x="600" y="638" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#991b1b">④ Planner 规划</text>
  <text x="600" y="666" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#b91c1c">后端类比：工作流引擎 / DAG 编排</text>
  <text x="600" y="692" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#dc2626">简单任务：让模型在循环里边想边做（ReAct）</text>
  <text x="600" y="714" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#dc2626">复杂任务：先拆计划再执行（Plan-and-Execute）</text>

  <!-- 连接线 -->
  <line x1="600" y1="258" x2="600" y2="340" stroke="#4f46e5" stroke-width="2.4" marker-end="url(#arC3)"/>
  <line x1="600" y1="522" x2="600" y2="598" stroke="#4f46e5" stroke-width="2.4" marker-end="url(#arC3)"/>
  <line x1="446" y1="431" x2="396" y2="431" stroke="#4f46e5" stroke-width="2.4" marker-end="url(#arC3)"/>
  <line x1="754" y1="431" x2="804" y2="431" stroke="#4f46e5" stroke-width="2.4" marker-end="url(#arC3)"/>

  <!-- 底部注脚 -->
  <rect x="70" y="766" width="1060" height="48" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="796" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14.5" fill="#334155">框架（LangChain / LangGraph / Eino）只是这四块的现成装配层；先手写一遍循环，再看任何框架都会觉得"不过如此"</text>
</svg>
