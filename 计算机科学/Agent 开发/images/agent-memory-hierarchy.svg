<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <marker id="arM5" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <filter id="shM5" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#0f172a">记忆系统：把计算机存储分层那套，原样搬到 Agent 上</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#475569">LLM 每次调用都是无状态的——所谓"记忆"，就是你在请求之间替它分层存取的那些数据</text>

  <!-- 表头 -->
  <text x="295" y="122" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#4338ca">Agent 的记忆层</text>
  <text x="905" y="122" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#0f766e">后端存储类比</text>

  <!-- L1 -->
  <rect x="80" y="142" width="430" height="120" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" filter="url(#shM5)"/>
  <text x="104" y="176" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#312e81">L1 上下文窗口（当前 messages）</text>
  <text x="104" y="204" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#3730a3">本轮要发给模型的全部消息与工具结果</text>
  <text x="104" y="230" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#4f46e5">特点：最快、最贵、容量最小（受 Token 窗口限制）</text>
  <text x="104" y="252" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#4f46e5">请求结束即"挥发"，需要你自己持久化</text>

  <line x1="526" y1="202" x2="656" y2="202" stroke="#334155" stroke-width="2.4" marker-end="url(#arM5)"/>

  <rect x="690" y="142" width="430" height="120" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#shM5)"/>
  <text x="714" y="176" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#0f172a">进程内存 / RAM</text>
  <text x="714" y="204" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#334155">直接参与本次计算，纳秒级访问</text>
  <text x="714" y="230" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">容量小、成本高、掉电丢失</text>

  <!-- L2 -->
  <rect x="80" y="292" width="430" height="120" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2" filter="url(#shM5)"/>
  <text x="104" y="326" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#115e59">L2 摘要记忆</text>
  <text x="104" y="354" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#0f766e">长对话滚动摘要：把旧消息压缩成要点</text>
  <text x="104" y="380" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#0d9488">特点：有损压缩、便宜一个数量级、读取快</text>
  <text x="104" y="402" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#0d9488">相当于"换进换出"的热数据</text>

  <line x1="526" y1="352" x2="656" y2="352" stroke="#334155" stroke-width="2.4" marker-end="url(#arM5)"/>

  <rect x="690" y="292" width="430" height="120" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#shM5)"/>
  <text x="714" y="326" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#0f172a">Redis 热缓存</text>
  <text x="714" y="354" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#334155">会话级状态、聚合视图、毫秒级访问</text>
  <text x="714" y="380" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">用空间和精度换成本与速度</text>

  <!-- L3 -->
  <rect x="80" y="442" width="430" height="120" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2" filter="url(#shM5)"/>
  <text x="104" y="476" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#065f46">L3 长期记忆（向量库 + 元数据）</text>
  <text x="104" y="504" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#047857">用户画像、历史事实、偏好，按语义检索召回</text>
  <text x="104" y="530" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#059669">特点：持久化、容量大、按相关度而非 key 取数</text>
  <text x="104" y="552" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#059669">取数要过权限与租户隔离，不能全量塞进窗口</text>

  <line x1="526" y1="502" x2="656" y2="502" stroke="#334155" stroke-width="2.4" marker-end="url(#arM5)"/>

  <rect x="690" y="442" width="430" height="120" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#shM5)"/>
  <text x="714" y="476" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#0f172a">业务数据库（PostgreSQL 等）</text>
  <text x="714" y="504" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#334155">持久事实，带索引、事务与权限</text>
  <text x="714" y="530" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">按需查询，永远不会一次全表加载</text>

  <!-- L4 -->
  <rect x="80" y="592" width="430" height="120" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2" filter="url(#shM5)"/>
  <text x="104" y="626" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#1e293b">L4 归档：原始会话日志</text>
  <text x="104" y="654" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#334155">每轮 Prompt、工具结果、模型输出、Trace、账单</text>
  <text x="104" y="680" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">特点：最冷、最全、最便宜；用于审计、复盘、评测</text>

  <line x1="526" y1="652" x2="656" y2="652" stroke="#334155" stroke-width="2.4" marker-end="url(#arM5)"/>

  <rect x="690" y="592" width="430" height="120" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" filter="url(#shM5)"/>
  <text x="714" y="626" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#0f172a">对象存储 / 数仓冷存储</text>
  <text x="714" y="654" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#334155">只追加、批量分析、合规留存</text>
  <text x="714" y="680" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748b">出问题时能回放现场</text>

  <!-- 底部结论 -->
  <rect x="80" y="738" width="1040" height="56" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="600" y="762" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="700" fill="#312e81">每轮请求只组装"L1 当前窗口 + 命中的 L2 摘要 / L3 长期记忆"发给 LLM</text>
  <text x="600" y="784" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#4338ca">越往下容量越大、单位成本越低、访问越慢——和 CPU Cache / RAM / 磁盘 / 磁带是同一条规律</text>
</svg>
