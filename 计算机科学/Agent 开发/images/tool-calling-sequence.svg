<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <marker id="arS4" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#334155"/>
    </marker>
    <marker id="arSDash" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#0f172a">Tool Calling 时序：模型只负责"点菜"，你的代码负责"上菜"</text>
  <text x="600" y="80" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#475569">关键认知：LLM 返回的 tool_calls 只是一个"调用申请"，真正执行工具、校验参数、回灌结果的永远是你的主循环</text>

  <!-- 循环区域背景 -->
  <rect x="352" y="180" width="728" height="470" rx="14" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="9 6"/>
  <rect x="372" y="166" width="330" height="26" rx="6" fill="#ffffff"/>
  <text x="380" y="185" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="700" fill="#6d28d9">Agent 循环内部（可重复多轮，强制上限）</text>

  <!-- 参与者 -->
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="55" y="110" width="150" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
    <text x="130" y="142" text-anchor="middle" font-size="15.5" font-weight="700" fill="#0f172a">用户</text>

    <rect x="335" y="110" width="150" height="52" rx="10" fill="#0f172a"/>
    <text x="410" y="142" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">Agent 主循环</text>

    <rect x="615" y="110" width="150" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="690" y="135" text-anchor="middle" font-size="15.5" font-weight="700" fill="#5b21b6">LLM API</text>
    <text x="690" y="153" text-anchor="middle" font-size="11.5" fill="#6d28d9">高延迟第三方服务</text>

    <rect x="915" y="110" width="150" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
    <text x="990" y="135" text-anchor="middle" font-size="15.5" font-weight="700" fill="#92400e">工具执行器</text>
    <text x="990" y="153" text-anchor="middle" font-size="11.5" fill="#b45309">你写的内部 API</text>
  </g>

  <!-- 生命线 -->
  <line x1="130" y1="166" x2="130" y2="730" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="410" y1="166" x2="410" y2="730" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="690" y1="166" x2="690" y2="730" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="990" y1="166" x2="990" y2="730" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 消息 -->
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#1e293b">
    <!-- 1 -->
    <line x1="130" y1="216" x2="404" y2="216" stroke="#334155" stroke-width="2" marker-end="url(#arS4)"/>
    <text x="142" y="206" font-weight="700" fill="#0f172a">① 目标</text>
    <text x="232" y="206">「今天北京天气怎么样？」</text>

    <!-- 2 -->
    <line x1="410" y1="272" x2="684" y2="272" stroke="#334155" stroke-width="2" marker-end="url(#arS4)"/>
    <text x="422" y="262" font-weight="700" fill="#0f172a">② 请求</text>
    <text x="482" y="262">messages 历史 + tools 工具清单（JSON 契约）</text>

    <!-- 3 -->
    <line x1="690" y1="328" x2="416" y2="328" stroke="#059669" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arSDash)"/>
    <text x="422" y="318" font-weight="700" fill="#065f46">③ 申请</text>
    <text x="482" y="318" fill="#065f46">tool_calls：get_weather(city="北京") —— 这不是答案！</text>

    <!-- 4 -->
    <line x1="410" y1="384" x2="984" y2="384" stroke="#334155" stroke-width="2" marker-end="url(#arS4)"/>
    <text x="422" y="374" font-weight="700" fill="#0f172a">④ 执行前</text>
    <text x="512" y="374">参数 Schema 校验 → 权限检查 → 超时 / 幂等控制 → 真正调用</text>

    <!-- 5 -->
    <line x1="990" y1="440" x2="416" y2="440" stroke="#059669" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arSDash)"/>
    <text x="422" y="430" font-weight="700" fill="#065f46">⑤ 观察</text>
    <text x="482" y="430" fill="#065f46">Observation：{"temp_c": 18, "condition": "多云"}（结构化、限长）</text>

    <!-- 6 -->
    <line x1="410" y1="496" x2="684" y2="496" stroke="#334155" stroke-width="2" marker-end="url(#arS4)"/>
    <text x="422" y="486" font-weight="700" fill="#0f172a">⑥ 回灌</text>
    <text x="482" y="486">把结果作为 tool 消息追加进 messages，发起第 2 轮请求</text>

    <!-- 7 -->
    <line x1="690" y1="552" x2="416" y2="552" stroke="#059669" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arSDash)"/>
    <text x="422" y="542" font-weight="700" fill="#065f46">⑦ 终判</text>
    <text x="482" y="542" fill="#065f46">普通文本（无 tool_calls）= 最终答案：「北京今天 18℃，多云」</text>

    <!-- 8 -->
    <line x1="410" y1="672" x2="136" y2="672" stroke="#334155" stroke-width="2" marker-end="url(#arS4)"/>
    <text x="142" y="662" font-weight="700" fill="#0f172a">⑧ 流式输出</text>
    <text x="232" y="662">打字机式渲染给用户，同时落 Trace 与 Token 账单</text>
  </g>

  <!-- 护栏提示条 -->
  <rect x="55" y="746" width="1090" height="40" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="600" y="772" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#991b1b">护栏：最大循环轮数（防死循环烧钱）· 总超时预算（context 传播）· 工具结果截断（防上下文爆窗）· 写操作二次确认</text>
</svg>
