<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Python Agent Worker 核心循环</title>
  <desc id="desc">用户输入进入 Python Worker，模型决定回答或申请工具，Worker 校验并执行工具，将结果回灌模型，直到获得最终答案或预算耗尽</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#245a46"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .worker { fill: #f5f8f6; stroke: #6f8379; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #52685e; stroke-width: 2; }
      .focus { fill: #e5f6ec; stroke: #08783f; stroke-width: 3; }
      .warn { fill: #fff4dd; stroke: #9a6500; stroke-width: 2; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #17211b; }
      .label { font: 650 20px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #17211b; }
      .meta { font: 16px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #425148; }
      .edge { fill: none; stroke: #245a46; stroke-width: 3; marker-end: url(#arrow); }
      .edge-dash { fill: none; stroke: #9a6500; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="52" y="58">Python Agent Worker：一个带边界的决策循环</text>

  <rect class="box" x="55" y="285" width="170" height="100" rx="8"/>
  <text class="label" x="140" y="326" text-anchor="middle">用户输入</text>
  <text class="meta" x="140" y="356" text-anchor="middle">自然语言目标</text>

  <rect class="worker" x="275" y="105" width="720" height="515" rx="14"/>
  <text class="label" x="305" y="145">Python Agent Worker</text>

  <rect class="focus" x="335" y="205" width="240" height="105" rx="8"/>
  <text class="label" x="455" y="247" text-anchor="middle">1. 请求模型</text>
  <text class="meta" x="455" y="277" text-anchor="middle">消息历史 + 工具目录</text>

  <rect class="box" x="680" y="205" width="250" height="105" rx="8"/>
  <text class="label" x="805" y="247" text-anchor="middle">2. 判断响应</text>
  <text class="meta" x="805" y="277" text-anchor="middle">最终回答或工具申请</text>

  <rect class="box" x="680" y="405" width="250" height="115" rx="8"/>
  <text class="label" x="805" y="443" text-anchor="middle">3. 执行工具</text>
  <text class="meta" x="805" y="473" text-anchor="middle">白名单 · 参数校验</text>
  <text class="meta" x="805" y="499" text-anchor="middle">调用实现 · 结构化结果</text>

  <rect class="box" x="335" y="405" width="240" height="115" rx="8"/>
  <text class="label" x="455" y="443" text-anchor="middle">4. 回灌结果</text>
  <text class="meta" x="455" y="473" text-anchor="middle">追加 role=tool 消息</text>
  <text class="meta" x="455" y="499" text-anchor="middle">进入下一轮决策</text>

  <rect class="warn" x="1045" y="165" width="180" height="105" rx="8"/>
  <text class="label" x="1135" y="207" text-anchor="middle">最终答案</text>
  <text class="meta" x="1135" y="237" text-anchor="middle">正常退出</text>

  <rect class="warn" x="1045" y="430" width="180" height="105" rx="8"/>
  <text class="label" x="1135" y="472" text-anchor="middle">预算耗尽</text>
  <text class="meta" x="1135" y="502" text-anchor="middle">受控失败</text>

  <path class="edge" d="M225 335 H335"/>
  <path class="edge" d="M575 257 H680"/>
  <path class="edge" d="M805 310 V405"/>
  <path class="edge" d="M680 462 H575"/>
  <path class="edge" d="M455 405 V340 H455 V310"/>
  <path class="edge" d="M930 232 H1045"/>
  <path class="edge-dash" d="M930 483 H1045"/>

  <text class="meta" x="946" y="218">无工具申请</text>
  <text class="meta" x="824" y="365">有工具申请</text>
  <text class="meta" x="935" y="468">超过最大轮数</text>
</svg>
