<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <defs>
    <marker id="arrowD" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#334155"/>
    </marker>
    <marker id="arrowG" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#059669"/>
    </marker>
    <marker id="arrowV" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowA" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="29" font-weight="700" fill="#0f172a">认知转换：一次 HTTP 请求 与 一次 Agent 运行</text>
  <text x="600" y="84" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15.5" fill="#475569">左边是你闭着眼都能画的链路；右边只是把"一次直线往返"换成了"一个带护栏的多次循环"</text>

  <!-- 左面板 -->
  <rect x="50" y="112" width="520" height="620" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="310" y="150" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#0f172a">传统后端：确定性直线</text>

  <!-- 链路节点 -->
  <rect x="200" y="178" width="220" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="310" y="203" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="700" fill="#0f172a">客户端</text>
  <text x="310" y="224" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#64748b">发起 HTTP 请求</text>

  <line x1="310" y1="240" x2="310" y2="272" stroke="#334155" stroke-width="2.2" marker-end="url(#arrowD)"/>
  <rect x="200" y="278" width="220" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="310" y="303" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="700" fill="#0f172a">网关 / 业务服务</text>
  <text x="310" y="324" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#64748b">鉴权、参数校验、编排</text>

  <line x1="310" y1="340" x2="310" y2="372" stroke="#334155" stroke-width="2.2" marker-end="url(#arrowD)"/>
  <rect x="200" y="378" width="220" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="310" y="403" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="700" fill="#0f172a">数据库 / 下游 RPC</text>
  <text x="310" y="424" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#64748b">确定性读写</text>

  <!-- 返回 -->
  <path d="M372 434 L372 470 L150 470 L150 206 L192 206" fill="none" stroke="#059669" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrowG)"/>
  <text x="392" y="464" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#059669">原路返回结构化响应</text>

  <!-- 特征 -->
  <rect x="90" y="500" width="440" height="206" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="112" y="532" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="700" fill="#0f172a">链路特征</text>
  <text x="112" y="564" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#334155">• 一次请求一次响应，调用深度预先可知</text>
  <text x="112" y="594" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#334155">• 同样输入必然得到同样输出（确定性）</text>
  <text x="112" y="624" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#334155">• 毫秒级，错误码语义明确</text>
  <text x="112" y="654" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#334155">• 无状态或仅有受控的会话状态</text>
  <text x="112" y="684" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#334155">• 成本按机器资源核算，可预测</text>

  <!-- 右面板 -->
  <rect x="630" y="112" width="520" height="620" rx="16" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="890" y="150" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#4c1d95">Agent：概率性循环</text>

  <!-- 用户 -->
  <rect x="800" y="176" width="180" height="52" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="890" y="208" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="700" fill="#4c1d95">用户给出目标</text>

  <line x1="890" y1="232" x2="890" y2="258" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrowV)"/>

  <!-- Agent 主循环 -->
  <rect x="700" y="264" width="380" height="318" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2.2"/>
  <text x="890" y="296" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#4c1d95">Agent 主循环（带护栏的 while）</text>

  <!-- LLM 节点 -->
  <rect x="800" y="318" width="180" height="62" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="890" y="344" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="700" fill="#5b21b6">LLM 决策</text>
  <text x="890" y="366" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#6d28d9">回答 还是 调工具？</text>

  <!-- 工具节点 -->
  <rect x="800" y="470" width="180" height="62" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="890" y="496" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="700" fill="#92400e">工具执行</text>
  <text x="890" y="518" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#b45309">搜索 / 计算 / 写库 / API</text>

  <!-- 循环箭头 -->
  <path d="M980 349 C 1030 360 1030 420 980 496" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrowV)"/>
  <text x="1036" y="430" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#6d28d9" transform="rotate(90 1036 430)">下发工具调用</text>
  <path d="M800 501 C 752 492 752 420 800 380" fill="none" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrowA)"/>
  <text x="742" y="430" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700" fill="#b45309" transform="rotate(-90 742 430)">观察结果回灌</text>

  <text x="890" y="566" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#7c3aed">第 1 轮、第 2 轮 …… 最多 N 轮（强制退出）</text>

  <!-- 输出 -->
  <path d="M890 586 L890 618" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrowG)"/>
  <rect x="780" y="622" width="220" height="50" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="890" y="653" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#065f46">流式输出最终答案</text>

  <!-- 特征（放右侧外面会超宽，改为底部条） -->
  <rect x="660" y="688" width="460" height="32" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="890" y="709" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#475569">多轮往返 · 秒级延迟 · 同输入不同输出 · 按 Token 计费 · 需管理上下文状态</text>
</svg>
