<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent Worker 检查点与进程重启恢复</title>
  <desc id="desc">第一个 Worker 完成工具调用后把 AgentState 写入 SQLite，进程退出后第二个 Worker 加载检查点并继续请求模型，最终保存成功状态</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#245a46"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .lane { fill: #f6f8f7; stroke: #9aaba3; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #52685e; stroke-width: 2; }
      .focus { fill: #e5f6ec; stroke: #08783f; stroke-width: 3; }
      .stop { fill: #fff0ed; stroke: #b23a2a; stroke-width: 2; }
      .db { fill: #edf4ff; stroke: #2f61a8; stroke-width: 3; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #17211b; }
      .label { font: 650 19px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #17211b; }
      .meta { font: 16px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #425148; }
      .line { fill: none; stroke: #245a46; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #b23a2a; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1280" height="760"/>
  <text class="title" x="50" y="56">SQLite 检查点：两个进程接力完成同一次 Agent Run</text>

  <rect class="lane" x="45" y="100" width="760" height="250" rx="12"/>
  <text class="label" x="75" y="137">进程 A · 首次执行</text>
  <rect class="box" x="85" y="185" width="190" height="95" rx="8"/>
  <text class="label" x="180" y="222" text-anchor="middle">模型申请工具</text>
  <text class="meta" x="180" y="252" text-anchor="middle">step = 1</text>
  <rect class="focus" x="340" y="185" width="210" height="95" rx="8"/>
  <text class="label" x="445" y="222" text-anchor="middle">工具执行完成</text>
  <text class="meta" x="445" y="252" text-anchor="middle">追加 role=tool</text>
  <rect class="stop" x="615" y="185" width="150" height="95" rx="8"/>
  <text class="label" x="690" y="222" text-anchor="middle">进程退出</text>
  <text class="meta" x="690" y="252" text-anchor="middle">内存全部丢失</text>
  <path class="line" d="M275 232 H340"/>
  <path class="dash" d="M550 232 H615"/>

  <rect class="db" x="875" y="245" width="330" height="235" rx="18"/>
  <text class="label" x="1040" y="292" text-anchor="middle">SQLite Checkpoint</text>
  <text class="meta" x="915" y="332">run_id: run-recovery-001</text>
  <text class="meta" x="915" y="364">status: RUNNING</text>
  <text class="meta" x="915" y="396">steps_completed: 1</text>
  <text class="meta" x="915" y="428">messages: system/user/assistant/tool</text>
  <text class="meta" x="915" y="460">version: 2</text>
  <path class="line" d="M550 270 C700 330 760 360 875 360"/>

  <rect class="lane" x="45" y="430" width="760" height="250" rx="12"/>
  <text class="label" x="75" y="467">进程 B · 重启恢复</text>
  <rect class="focus" x="85" y="515" width="205" height="95" rx="8"/>
  <text class="label" x="188" y="552" text-anchor="middle">加载 AgentState</text>
  <text class="meta" x="188" y="582" text-anchor="middle">从 step = 2 继续</text>
  <rect class="box" x="355" y="515" width="190" height="95" rx="8"/>
  <text class="label" x="450" y="552" text-anchor="middle">模型最终回答</text>
  <text class="meta" x="450" y="582" text-anchor="middle">读取已回灌结果</text>
  <rect class="focus" x="610" y="515" width="155" height="95" rx="8"/>
  <text class="label" x="688" y="552" text-anchor="middle">保存成功</text>
  <text class="meta" x="688" y="582" text-anchor="middle">version = 3</text>
  <path class="line" d="M290 562 H355"/>
  <path class="line" d="M545 562 H610"/>
  <path class="line" d="M875 430 C780 500 760 520 765 545"/>
</svg>
