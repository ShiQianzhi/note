<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">企业级 Agent 混合架构</title>
  <desc id="desc">Go 网关、Kafka、Python Agent Worker、Redis、PostgreSQL、模型服务与业务工具的关系</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#31594a"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .group { fill: #f6f8f7; stroke: #9aaba3; stroke-width: 2; stroke-dasharray: 9 7; }
      .box { fill: #ffffff; stroke: #64756d; stroke-width: 2; rx: 10; }
      .focus { fill: #e7f7ee; stroke: #08783f; stroke-width: 3; rx: 10; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #17211b; }
      .label { font: 600 20px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #17211b; }
      .meta { font: 16px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #4f5d56; }
      .scope { font: 600 17px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #4f5d56; }
      .line { fill: none; stroke: #31594a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .primary { stroke: #08783f; stroke-width: 4; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="title" x="60" y="55">Go 接入层与 Python Agent Worker 混合架构</text>
  <rect class="group" x="240" y="90" width="900" height="540" rx="18"/>
  <text class="scope" x="270" y="125">无状态应用与独立扩缩容边界</text>

  <rect class="box" x="50" y="230" width="150" height="90"/>
  <text class="label" x="125" y="265" text-anchor="middle">Web / App</text>
  <text class="meta" x="125" y="294" text-anchor="middle">用户请求与 SSE</text>

  <rect class="focus" x="280" y="200" width="210" height="120"/>
  <text class="label" x="385" y="242" text-anchor="middle">Go Gin Gateway</text>
  <text class="meta" x="385" y="273" text-anchor="middle">JWT · 限流 · 配额</text>
  <text class="meta" x="385" y="298" text-anchor="middle">幂等 · SSE · 租户</text>

  <rect class="box" x="570" y="200" width="180" height="120"/>
  <text class="label" x="660" y="242" text-anchor="middle">Kafka</text>
  <text class="meta" x="660" y="273" text-anchor="middle">任务 · 重试</text>
  <text class="meta" x="660" y="298" text-anchor="middle">重放 · 死信</text>

  <rect class="box" x="830" y="200" width="240" height="120"/>
  <text class="label" x="950" y="242" text-anchor="middle">Python Agent Worker</text>
  <text class="meta" x="950" y="273" text-anchor="middle">LangGraph · Tool · RAG</text>
  <text class="meta" x="950" y="298" text-anchor="middle">预算 · 检查点 · HITL</text>

  <rect class="box" x="280" y="440" width="210" height="100"/>
  <text class="label" x="385" y="480" text-anchor="middle">Redis</text>
  <text class="meta" x="385" y="510" text-anchor="middle">限流 · 缓存 · Pub/Sub</text>

  <rect class="box" x="570" y="440" width="210" height="100"/>
  <text class="label" x="675" y="480" text-anchor="middle">PostgreSQL</text>
  <text class="meta" x="675" y="510" text-anchor="middle">Run · Event · Checkpoint</text>

  <rect class="box" x="860" y="410" width="210" height="75"/>
  <text class="label" x="965" y="442" text-anchor="middle">模型服务</text>
  <text class="meta" x="965" y="468" text-anchor="middle">云 API / vLLM</text>

  <rect class="box" x="860" y="520" width="210" height="75"/>
  <text class="label" x="965" y="552" text-anchor="middle">业务工具</text>
  <text class="meta" x="965" y="578" text-anchor="middle">RPC / HTTP / Database</text>

  <path class="line primary" d="M200 275 H272"/>
  <path class="line primary" d="M490 260 H562"/>
  <path class="line primary" d="M750 260 H822"/>
  <path class="line" d="M385 320 V432"/>
  <path class="line" d="M490 300 C560 350 610 390 650 432"/>
  <path class="line" d="M950 320 V402"/>
  <path class="line" d="M930 320 C850 365 790 410 745 432"/>
  <path class="line" d="M950 320 C1040 375 1040 465 990 512"/>
</svg>
